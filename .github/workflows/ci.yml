name: Django and static checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: python manage.py check
      - run: python manage.py test --verbosity 1
      - name: Check JavaScript syntax in both versions
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find docs prototype/static/prototype -type f -name '*.js' -print0)
