{% load static %}
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Klikalna makieta aplikacji Greenhouse Manager przygotowana w Django.">
  <title>Greenhouse Manager · prototyp Django</title>
  <link rel="stylesheet" href="{% static 'prototype/styles.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/planning.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/visual-refresh.css' %}">
  <link rel="icon" href="{% static 'prototype/brand-logo.svg' %}" type="image/svg+xml">
</head>
<body>
  <div id="prototype-app" data-initial-screen="{{ initial_screen }}" data-assets-prefix="{% static 'prototype/' %}"></div>
  <noscript>Do obsługi klikalnej makiety potrzebny jest JavaScript.</noscript>
  <script src="{% static 'prototype/app.js' %}"></script>
</body>
</html>
