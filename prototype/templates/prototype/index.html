{% load static %}
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Klikalna makieta aplikacji Greenhouse Manager przygotowana w Django.">
  <meta name="theme-color" content="#0d5b3b">
  <meta name="application-name" content="Greenhouse Manager">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="Greenhouse Manager · klikalna makieta">
  <meta property="og:description" content="Plan, ludzie, prace i raport zmiany w jednym systemie.">
  <meta property="og:image" content="{% static 'prototype/og-v2.png' %}">
  <meta property="og:image:alt" content="Greenhouse Manager — Plan, Ludzie, Prace, Raport">
  <meta name="twitter:card" content="summary_large_image">
  <title>Greenhouse Manager · prototyp Django</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="{% static 'prototype/styles.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/planning.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/visual-refresh.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/enhancements.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/hydra-features.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/frontend-v2.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/ux-v3.css' %}">
  <link rel="stylesheet" href="{% static 'prototype/visual-system-v4.css' %}">
  <link rel="icon" href="{% static 'prototype/brand-logo.svg' %}" type="image/svg+xml">
</head>
<body>
  <div id="prototype-app" data-initial-screen="{{ initial_screen }}" data-assets-prefix="{% static 'prototype/' %}" data-service-worker-url="/sw.js"></div>
  <noscript>Do obsługi klikalnej makiety potrzebny jest JavaScript.</noscript>
  <script src="{% static 'prototype/enhancements.js' %}"></script>
  <script src="{% static 'prototype/hydra-features.js' %}"></script>
  <script src="{% static 'prototype/ux-v3.js' %}"></script>
  <script src="{% static 'prototype/visual-system-v4.js' %}"></script>
  <script src="{% static 'prototype/app.js' %}"></script>
</body>
</html>
